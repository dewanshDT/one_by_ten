<svg width="120" height="60" viewBox="0 0 120 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 1/10 typographic mark with gradient accent -->
  <defs>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D1FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- "1" -->
  <rect x="10" y="15" width="4" height="30" fill="url(#accentGradient)"/>
  
  <!-- "/" -->
  <path d="M 35 45 L 45 15" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- "1" -->
  <rect x="55" y="15" width="4" height="30" fill="url(#accentGradient)"/>
  
  <!-- "0" -->
  <circle cx="85" cy="30" r="15" stroke="url(#accentGradient)" stroke-width="3" fill="none"/>
</svg>

